<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacts</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      #prj {
        color: black;
        font-size: 150%;
      }

      button {
        width: 100%;
        max-width: 300px;
        margin: 0.5rem 0;
      }

      @media screen and (max-width: 423px) {
        nav {
          flex-direction: row;
          text-align: left;
        }

        #center {
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .container {
          width: 90%;
          padding: 1rem;
        }
      }

      .contact-label {
        font-weight: bold;
        font-size: 1.2rem;
        margin-top: 1rem;
      }

      .contact-button a {
        text-decoration: none;
        color: inherit;
      }

      .contact-section {
        padding: 1rem;
        max-width: 600px;
        margin: auto;
      }

      .contact-form {
        margin-top: 2rem;
        background: #e7f3e5;
        padding: 1rem;
        border-radius: 10px;
      }

      iframe {
        width: 100%;
        height: 300px;
        border: 0;
        border-radius: 10px;
        margin-top: 1rem;
      }

      .btn-login {
        background-color: #4e9af1;
        color: white;
        font-weight: 600;
        font-size: 1.1rem;
        border: none;
        border-radius: 8px;
        padding: 10px 0;
        transition: background-color 0.3s ease-in-out;
      }

      .btn-login:hover {
        background-color: #3d8de0;
      }

      #alert_name,
      #alert_email,
      #alert_message {
        color: red;
      }
    </style>
  </head>

  <body>
    <header>
      <h1 id="h1">Contact with Pragyan Sapkota</h1>
    </header>

    <nav>
      <a href="profile.html">
        <img src="BA956C0D-428D-440C-B4D3-51441323296E_1_201_a.jpeg" height="35" class="profile-img" />
      </a>
      <a href="index.html">Dashboard</a>
      <a href="aboutme.html">About Me</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
      <a href="photo.html">Photos</a>
    </nav>

    <div class="contact-section">
      <p class="contact-label">
        For any more queries, you can contact me at the following address:
      </p>

      <p class="contact-label"><strong>Email:</strong></p>
      <div id="prg">
        <button type="button" class="btn btn-outline-secondary contact-button">
          <a href="mailto:pragyansapkota67@gmail.com"
            >pragyansapkota67@gmail.com</a
          >
        </button>
      </div>

      <p class="contact-label"><strong>Facebook:</strong></p>
      <div id="prg">
        <button type="button" class="btn btn-outline-danger contact-button">
          <a
            href="https://www.facebook.com/profile.php?id=61558869628659"
            target="_blank"
            >Pragyan Sapkota</a
          >
        </button>
      </div>

      <p class="contact-label"><strong>Instagram:</strong></p>
      <div id="prg">
        <button type="button" class="btn btn-outline-success contact-button">
          <a href="https://www.instagram.com/sapkotapragyan/" target="_blank"
            >Pragyan Sapkota</a
          >
        </button>
      </div>

      <p class="contact-label"><strong>Whatsapp/Mobile:</strong></p>
      <div id="prg">
        <a href="tel:9766618843">
          <button type="button" class="btn btn-outline-warning">
            9766618843
          </button>
        </a>
      </div>

      <!-- Map Embed -->
      <p class="contact-label">Find Me on Map:</p>
      <iframe
        src="https://maps.google.com/maps?q=kathmandu&t=&z=13&ie=UTF8&iwloc=&output=embed"
      ></iframe>

      <!-- Form -->
      <div class="contact-form">
        <form action="mailto:pragyansapkota67@gmail.com" method="post">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              placeholder="Enter your full name *"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email *"
              required
            />
          </div>
          <div class="form-floating mb-3">
            <textarea
              class="form-control"
              placeholder="Leave a comment here"
              id="floatingTextarea2"
              style="height: 100px"
              required
            ></textarea>
            <label for="floatingTextarea2"
              >Leave a comment for @PragyanSapkota *</label
            >

            <div id="alert_message"></div>
          </div>
          <button type="button" class="btn btn-login w-100" id="loginButton">
            Submmit
          </button>
        </form>
      </div>
    </div>
    <footer>
      <p>&copy; 2026 Pragyan Sapkota. All rights reserved.</p>
    </footer>

    <script>
      document
        .getElementById("loginButton")
        .addEventListener("click", function () {
          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const floatingTextarea2 = document
            .getElementById("floatingTextarea2")
            .value.trim();
          if (!name || !email || !floatingTextarea2) {
            document.getElementById('alert_message').innerHTML= `Incomplete form`;
          } else {
             alert("Message successfully sent");
             window.location.href='contact.html';
          }
        });
    </script>
  </body>
</html>
